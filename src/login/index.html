<!DOCTYPE html>
<html lang="de">
    <head>
        <meta charset="UTF-8">
        <title>B.A.M.B.I. v.0.1</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		 <script src="script.js"></script>
		 <link rel="stylesheet" href="styles.css">
    </head>
    <body onload="checkSetup()">
		<!--div id="title"-->
			<header id="header">
				<!-- <h1> -->
					<div class="header-logo"><img src="static/LogoBambiWebsite.png" alt="logo"/></div>
					<div class="header-text">MINT-Zentrum Seeheim</div>
				<!-- </h1> -->
			</header>
		<!-- </div> -->
		 <main>
		<div id="login">
			<!-- <label for="user">username</label> -->
			<input type="text" placeholder="username..." name="user" 
				onkeyup="pressed(event, 'user')" id="user"></input>
			<!-- <label for="pwd">password</label> -->
			<input type="password" placeholder="password..." name="pwd" 
				onkeyup="pressed(event, 'pwd')" id="pwd"></input>
			<button onclick="login()">login</button>
			<div class="msg" id="login-msg" role="alert"></div>
		</div>

		<!-- Nur solange es noch gar keinen Zugang gibt (siehe script.js). -->
		<form id="setup" class="hidden" novalidate>
			<h2>Ersten Admin-Zugang anlegen</h2>
			<div class="intro">
				Es gibt noch keinen Zugang. Wer sich hier als Erstes einträgt,
				wird Administrator*in und kann danach weitere Lehrkräfte anlegen.
			</div>
			<label for="s-first">Vorname</label>
			<input id="s-first" autocomplete="given-name" required>
			<label for="s-last">Nachname</label>
			<input id="s-last" autocomplete="family-name" required>
			<label for="s-gender">Geschlecht</label>
			<select id="s-gender" required>
				<option value="">Bitte wählen</option>
			</select>
			<label for="s-mail">E-Mail (zum Anmelden)</label>
			<input id="s-mail" type="email" autocomplete="username" required>
			<label for="s-pw1">Passwort (mindestens 8 Zeichen)</label>
			<input id="s-pw1" type="password" autocomplete="new-password" required>
			<label for="s-pw2">Passwort wiederholen</label>
			<input id="s-pw2" type="password" autocomplete="new-password" required>
			<button type="submit" id="s-submit">Zugang anlegen</button>
			<div class="msg" id="setup-msg" role="alert"></div>
		</form>
		</main>
		<footer>
			<p>&copy; Annika Reinhardt, David Glänzel & Ben Schnorrenberger</p>
		</footer>
    </body>
</html>
