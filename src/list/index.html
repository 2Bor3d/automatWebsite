<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>B.A.M.B.I. v.0.1</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/page/script.js"></script>
    <link rel="stylesheet" href="page/styles.css">
    <script src="/static/datepicker.js"></script>
    <link rel="stylesheet" href="/static/datepicker.css">
</head>
<body onload="load(); initDatePicker(document.getElementById('birthday'), {}); initDatePicker(document.getElementById('attendanceDate'), {})">
<div id="course-banner" class="hidden"></div>
<div id="searchbar">
    <input id="search" placeholder="suchen..."/>
    <button id="searchbutton" onclick="search()">suchen</button>
</div>
<main id="list">
    <table id="table">
        <tr>
            <th>Vorname</th>
            <th>Nachname</th>
            <th>Anwesenheit</th>
            <th>Zeitkonto</th>
            <th>Letzte 7 Termine</th>
        </tr>
    </table>
</main>
<div id="popup" class="hidden">
    <div class="modal-panel">
        <nav class="modal-rail">
            <button type="button" class="active" data-jump="sec-person"><span class="dot"></span>Person</button>
            <button type="button" data-jump="sec-anwesenheit"><span class="dot"></span>Anwesenheit</button>
            <button type="button" class="admin-field" style="display:none" data-jump="sec-kurse"><span class="dot"></span>Kurse</button>
            <button type="button" class="admin-field" style="display:none" data-jump="sec-adresse"><span class="dot"></span>Adresse</button>
            <button type="button" class="admin-field" style="display:none" data-jump="sec-chip"><span class="dot"></span>Chipkarte</button>
        </nav>
        <div class="modal-main">
            <div class="modal-head">
                <h3>Schüler bearbeiten <span id="identification" class="modal-id"></span></h3>
                <button id="close" class="modal-close" onclick="closePopup()" aria-label="Schließen">✕</button>
            </div>
            <div class="modal-scroll">
                <section class="modal-section" id="sec-person">
                    <p class="sec-title">Person</p>
                    <div class="row">
                        <div class="field-pair">
                            <p class="lable">Vorname: </p>
                            <input id="firstName" disabled>
                        </div>
                        <div class="field-pair">
                            <p class="lable">Nachname: </p>
                            <input id="lastName" disabled>
                        </div>
                    </div>
                    <div class="row admin-field" style="display:none">
                        <p class="lable">Geschlecht: </p>
                        <select id="gender"></select>
                    </div>
                    <div class="row admin-field" style="display:none">
                        <p class="lable">Geburtstag: </p>
                        <input id="birthday" type="date">
                    </div>
                </section>

                <section class="modal-section" id="sec-anwesenheit">
                    <p class="sec-title">Anwesenheit</p>
                    <div class="row">
                        <p class="lable">Anwesenheit: </p>
                        <div class="field-pair">
                            <input id="attendanceDate" type="date">
                            <select id="attendance">
                                <option value="none">Kein Eintrag</option>
                                <option value="present">Anwesend</option>
                                <option value="excused">Entschuldigt</option>
                                <option value="absent">Abwesend</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <p class="lable">Zeitkonto: </p>
                        <input id="balance" type="number">
                    </div>
                </section>

                <section class="modal-section admin-field" id="sec-kurse" style="display:none">
                    <p class="sec-title">Kurse</p>
                    <div class="row">
                        <div id="kurs-select">
                            <input id="kurs-search" type="text" placeholder="Suchen…" autocomplete="off">
                            <div id="kurs-options"></div>
                        </div>
                    </div>
                </section>

                <section class="modal-section admin-field" id="sec-adresse" style="display:none">
                    <p class="sec-title">Adresse</p>
                    <div class="row">
                        <div id="address-block">
                            <input id="addr-nr" type="number" placeholder="Hausnr.">
                            <input id="addr-street" placeholder="Straße">
                            <input id="addr-city" placeholder="Stadt">
                            <input id="addr-zip" type="number" placeholder="PLZ">
                            <input id="addr-country" placeholder="Land">
                        </div>
                    </div>
                </section>

                <section class="modal-section admin-field" id="sec-chip" style="display:none">
                    <p class="sec-title">Chipkarte</p>
                    <div class="row">
                        <span id="rfid-display"></span>
                        <button type="button" id="rfid-scan-btn" onclick="startRfidScan(this)">Karte scannen</button>
                        <span id="rfid-scan-status"></span>
                    </div>
                </section>
            </div>
            <div class="modal-foot">
                <button id="delete" disabled>Löschen</button>
                <button id="save">Speichern</button>
            </div>
        </div>
    </div>
</div>
</body>
</html>
